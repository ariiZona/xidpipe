[package]
name = "xidpipe"
version = "0.2.6"
edition = "2024"
description = "Use an original Xbox controller (incl. 3rd-party) on a PC, through a homebrew Xbox over the network"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[dependencies]
eframe = "0.37"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
