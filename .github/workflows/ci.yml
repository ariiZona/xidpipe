# GitHub Actions. Forgejo runs .forgejo/workflows/ci.yml instead: it reads only the first workflow folder
# it finds, and .forgejo/workflows comes before .github/workflows.
name: CI

# Version tags and pull requests run it (plain pushes don't: a commit pushed together with its tag
# would otherwise run twice). "Run workflow" on the Actions page starts it by hand for any branch.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    name: PC app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: xidpipe-${{ runner.os }}
          path: |
            pc/target/release/xidpipe
            pc/target/release/xidpipe.exe
          if-no-files-found: error

  xbox:
    name: Xbox app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nxdk prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm bison flex cmake make
      - name: Unit tests (FTP paths, HTTP and update-check parsing)
        run: cc -std=c11 -Wall -Wextra -Werror -o util_test xbox/tests/util_test.c xbox/util.c && ./util_test
      - name: Build
        working-directory: xbox
        run: nxdk/bin/activate make -j"$(nproc)"
      - uses: actions/upload-artifact@v7
        with:
          name: xidpipe-xbox
          path: |
            xbox/bin/default.xbe
            xbox/xidpipe.iso
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes a GitHub release with the builds above attached and
  # the matching CHANGELOG.md section as notes. GitHub only (gh release needs GitHub's API).
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    needs: [pc, xbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version in pc/Cargo.toml
        run: |
          version=$(grep -m1 '^version' pc/Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Package
        run: |
          v="$GITHUB_REF_NAME"
          mkdir out
          cp README.md LICENSE dist/xidpipe-Windows/
          cp -r pcsx2 dist/xidpipe-Windows/
          (cd dist/xidpipe-Windows && zip -9 "../../out/xidpipe-$v-windows-x64.zip" xidpipe.exe README.md LICENSE pcsx2/*.ini)
          cp README.md LICENSE dist/xidpipe-Linux/ && chmod +x dist/xidpipe-Linux/xidpipe
          mkdir -p dist/xidpipe-Linux/pcsx2
          cp pcsx2/xidpipe-two-pads.ini dist/xidpipe-Linux/pcsx2/
          tar -C dist/xidpipe-Linux -czf "out/xidpipe-$v-linux-x64.tar.gz" xidpipe README.md LICENSE pcsx2
          (cd dist/xidpipe-xbox && zip -9 -j "../../out/xidpipe-$v-xbox.zip" bin/default.xbe xidpipe.iso)
          # The Xbox app's update check downloads this file by this exact name.
          cp dist/xidpipe-xbox/bin/default.xbe "out/xidpipe-$v-default.xbe"
          ls -l out
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## $GITHUB_REF_NAME" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "xidpipe $GITHUB_REF_NAME" --notes-file notes.md
